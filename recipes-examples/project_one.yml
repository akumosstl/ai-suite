recipe:
  name: "Creating project with target"
  version: "1.0"
  description: "Creates a project"

parameters:
  project_name: "project_one"

projects:
  - id: "project_one_id"
    name: "{{param:project_name}}"
    description: "Test project created by recipe"
    path: "C:/Users/USER/.agentic-workspace/{{param:project_name}}"
    #target: "dev"
    status: "active"
    readme: "# Hello Project\n\nCreated by recipe."

tasks:  
  - id: "t-create-project"
    type: "create"
    resource: "project"
    ref: "project_one_id"
