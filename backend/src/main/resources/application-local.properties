agentic.version=3.3.1
spring.application.name=agentic-backend
server.port=1488
spring.main.allow-circular-references=true
spring.main.allow-bean-definition-override=true
spring.aop.proxy-target-class=false
spring.datasource.url=jdbc:h2:file:${user.home}/.agentic/db/agentic_db;AUTO_SERVER=TRUE;LOCK_TIMEOUT=10000;WRITE_DELAY=0
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=agentic123
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.bytecode.provider=bytebuddy

plugins.registry.url=https://raw.githubusercontent.com/akumosstl/akumosstl.github.io/main/plugins.json

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.io.github.akumosstl=INFO

spring.main.banner-mode=off
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n