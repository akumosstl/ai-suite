spring.application.name=agentic-backend-test
server.port=0
spring.datasource.url=jdbc:h2:file:${java.io.tmpdir}/agentic-test;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximumPoolSize=1
spring.h2.console.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.bytecode.provider=bytebuddy
spring.main.allow-circular-references=true
spring.aop.proxy-target-class=false
logging.level.root=WARN
logging.level.io.github.akumosstl.agentic.backend=INFO
logging.level.org.springframework.test=INFO
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
mcp.enabled=false